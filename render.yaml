services:
  - type: web
    name: medcad
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
    disk:
      name: medcad-data
      mountPath: /var/data
      sizeGB: 1
